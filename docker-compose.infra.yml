# ---------------------------------------------------------------------------
# docker-compose.infra.yml
# Infrastructure-only services for local development.
# Run with: docker compose -f docker-compose.infra.yml up -d
#
# Services:
#   - PostgreSQL :5432  — auth_db (users, tokens) + conversation_db (threads, messages)
#   - Qdrant     :6333  — vector DB for memory-service
#   - Redis      :6379  — cache / rate-limiting
#   - Mailhog    :8025  — email catcher (SMTP :1025)
#
# Env vars to set in each service .env:
#   auth-service:         DATABASE_URL=postgresql+asyncpg://dev:dev@localhost:5432/auth_db
#   conversation-service: CONVERSATION_DB_URL=postgresql+asyncpg://dev:dev@localhost:5432/conversation_db
#   memory-service:       QDRANT_URL=http://localhost:6333
# ---------------------------------------------------------------------------

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dev_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_MULTIPLE_DATABASES: auth_db,conversation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Qdrant ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: dev_qdrant
    ports:
      - "6333:6333"   # REST API + Web UI  →  http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: dev_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mailhog ─────────────────────────────────────────────────────────────────
  # SMTP: localhost:1025  (no auth)
  # Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dev_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  qdrant_data:
  redis_data:
