syntax = "proto3";
package auth;

service AuthService {
  rpc ValidateToken (ValidateTokenRequest)  returns (ValidateTokenResponse);
  rpc GetUser       (GetUserRequest)        returns (UserResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool   valid   = 1;
  string user_id = 2;
  string email   = 3;
  string role    = 4;
  string error   = 5;
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string user_id    = 1;
  string email      = 2;
  string username   = 3;
  string role       = 4;
  bool   is_active  = 5;
}
